name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Write project files
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'__EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ttdl.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.ttdl.app"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          __EOF__
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:label="تحميل تيك توك"
                  android:icon="@drawable/ic_download"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".ClipActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:taskAffinity=""
                      android:theme="@android:style/Theme.Translucent.NoTitleBar"/>

                  <service
                      android:name=".BubbleService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating_download_button"/>
                  </service>
              </application>
          </manifest>
          __EOF__
          mkdir -p app/src/main/java/com/ttdl/app
          cat > app/src/main/java/com/ttdl/app/BubbleService.kt <<'__EOF__'
          package com.ttdl.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.ImageView

          class BubbleService : Service() {

              private lateinit var wm: WindowManager
              private var bubble: ImageView? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startAsForeground()
                  if (bubble == null) addBubble()
                  return START_STICKY
              }

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("bubble", "الأيقونة العائمة", NotificationManager.IMPORTANCE_MIN)
                  )
                  val n = Notification.Builder(this, "bubble")
                      .setContentTitle("تحميل تيك توك يعمل")
                      .setContentText("الأيقونة العائمة فعّالة")
                      .setSmallIcon(R.drawable.ic_download)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, n)
                  }
              }

              private fun addBubble() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val size = (56 * resources.displayMetrics.density).toInt()

                  val params = WindowManager.LayoutParams(
                      size, size,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = resources.displayMetrics.widthPixels - size - 16
                      y = resources.displayMetrics.heightPixels / 2
                  }

                  val v = ImageView(this).apply { setImageResource(R.drawable.ic_download) }

                  var startX = 0; var startY = 0
                  var touchX = 0f; var touchY = 0f
                  var moved = false

                  v.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = params.x; startY = params.y
                              touchX = e.rawX; touchY = e.rawY; moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - touchX).toInt()
                              val dy = (e.rawY - touchY).toInt()
                              if (Math.abs(dx) + Math.abs(dy) > 12) moved = true
                              if (moved) {
                                  params.x = startX + dx
                                  params.y = startY + dy
                                  wm.updateViewLayout(v, params)
                              }
                          }
                          MotionEvent.ACTION_UP -> if (!moved) onBubbleTap()
                      }
                      true
                  }

                  wm.addView(v, params)
                  bubble = v
              }

              // قراءة الحافظة تحتاج نافذة عليها التركيز، لذلك نفتح شاشة شفافة لحظياً
              private fun onBubbleTap() {
                  startActivity(
                      Intent(this, ClipActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
              }

              override fun onDestroy() {
                  bubble?.let { wm.removeView(it) }
                  bubble = null
                  super.onDestroy()
              }
          }
          __EOF__
          mkdir -p app/src/main/java/com/ttdl/app
          cat > app/src/main/java/com/ttdl/app/ClipActivity.kt <<'__EOF__'
          package com.ttdl.app

          import android.app.Activity
          import android.content.ClipboardManager
          import android.widget.Toast

          class ClipActivity : Activity() {
              private var handled = false

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (!hasFocus || handled) return
                  handled = true

                  val cm = getSystemService(ClipboardManager::class.java)
                  val text = cm.primaryClip?.getItemAt(0)?.coerceToText(this)?.toString().orEmpty()
                  val link = Regex("https?://\\S*tiktok\\.com\\S*").find(text)?.value

                  if (link == null) {
                      Toast.makeText(
                          this, "انسخ الرابط أولاً: مشاركة ← نسخ الرابط", Toast.LENGTH_LONG
                      ).show()
                  } else {
                      Downloader.start(applicationContext, link)
                  }
                  finish()
                  overridePendingTransition(0, 0)
              }
          }
          __EOF__
          mkdir -p app/src/main/java/com/ttdl/app
          cat > app/src/main/java/com/ttdl/app/Downloader.kt <<'__EOF__'
          package com.ttdl.app

          import android.app.DownloadManager
          import android.content.Context
          import android.net.Uri
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.widget.Toast
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          object Downloader {

              fun start(ctx: Context, link: String) {
                  val ui = Handler(Looper.getMainLooper())
                  fun toast(t: String) = ui.post { Toast.makeText(ctx, t, Toast.LENGTH_LONG).show() }

                  toast("جاري جلب الفيديو...")
                  Thread {
                      try {
                          val api = "https://www.tikwm.com/api/?hd=1&url=" + URLEncoder.encode(link, "UTF-8")
                          val c = URL(api).openConnection() as HttpURLConnection
                          c.connectTimeout = 15000
                          c.readTimeout = 15000
                          c.setRequestProperty("User-Agent", "Mozilla/5.0")
                          val json = JSONObject(c.inputStream.bufferedReader().readText())

                          val d = json.optJSONObject("data")
                              ?: throw Exception(json.optString("msg", "تعذر جلب الفيديو"))
                          var url = d.optString("hdplay")
                          if (url.isEmpty()) url = d.optString("play")
                          if (url.isEmpty()) throw Exception("لا يوجد رابط تحميل")

                          val id = d.optString("id", System.currentTimeMillis().toString())
                          val req = DownloadManager.Request(Uri.parse(url))
                              .setTitle("tiktok_$id.mp4")
                              .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                              .setDestinationInExternalPublicDir(
                                  Environment.DIRECTORY_MOVIES, "TikTok/tiktok_$id.mp4"
                              )
                          ctx.getSystemService(DownloadManager::class.java).enqueue(req)
                          toast("بدأ التحميل، تجده في مجلد Movies/TikTok")
                      } catch (e: Exception) {
                          toast("فشل التحميل: ${e.message}")
                      }
                  }.start()
              }
          }
          __EOF__
          mkdir -p app/src/main/java/com/ttdl/app
          cat > app/src/main/java/com/ttdl/app/MainActivity.kt <<'__EOF__'
          package com.ttdl.app

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                      setPadding(56, 120, 56, 56)
                      setBackgroundColor(Color.parseColor("#F2F5F3"))
                  }

                  root.addView(TextView(this).apply {
                      text = "حمّل فيديو تيك توك\nبدون علامة مائية"
                      textSize = 26f
                      setTextColor(Color.parseColor("#12202B"))
                      gravity = Gravity.START
                  })

                  root.addView(TextView(this).apply {
                      text = "\n١. اضغط تشغيل وفعّل «العرض فوق التطبيقات».\n" +
                          "٢. افتح تيك توك، ستجد أيقونة ⬇ عائمة.\n" +
                          "٣. على الفيديو: مشاركة ← نسخ الرابط.\n" +
                          "٤. اضغط الأيقونة العائمة فيبدأ التحميل.\n"
                      textSize = 16f
                      setTextColor(Color.parseColor("#5D6B74"))
                      setLineSpacing(8f, 1f)
                  })

                  val start = Button(this).apply {
                      text = "تشغيل"
                      textSize = 20f
                      setOnClickListener { startBubble() }
                  }
                  val stop = Button(this).apply {
                      text = "إيقاف"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, BubbleService::class.java))
                      }
                  }
                  root.addView(start)
                  root.addView(stop)
                  setContentView(root)

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
              }

              private fun startBubble() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "فعّل «العرض فوق التطبيقات» ثم ارجع واضغط تشغيل", Toast.LENGTH_LONG).show()
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                      return
                  }
                  startForegroundService(Intent(this, BubbleService::class.java))
                  Toast.makeText(this, "تم التشغيل. افتح تيك توك الآن", Toast.LENGTH_LONG).show()
              }
          }
          __EOF__
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_download.xml <<'__EOF__'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp" android:height="96dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#2FD3C1"
                  android:pathData="M12,12m-11,0a11,11 0,1 1,22 0a11,11 0,1 1,-22 0"/>
              <path android:fillColor="#12202B"
                  android:pathData="M11,5h2v7h3l-4,4.5l-4,-4.5h3z"/>
              <path android:fillColor="#12202B"
                  android:pathData="M7,18h10v2h-10z"/>
          </vector>
          __EOF__
          cat > build.gradle.kts <<'__EOF__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __EOF__
          cat > gradle.properties <<'__EOF__'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          kotlin.code.style=official
          __EOF__
          cat > settings.gradle.kts <<'__EOF__'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TTDownloader"
          include(":app")
          __EOF__
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TikTok-Downloader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
